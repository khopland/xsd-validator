name: Publish release

on:
  push:
    tags:
      - "v0.2.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      - name: Set version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^0\.2\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be v0.2.PATCH"
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$version" \
            -DgenerateBackupPoms=false
          sed -i "s|<tag>HEAD</tag>|<tag>${GITHUB_REF_NAME}</tag>|" pom.xml
          grep -Fq "<tag>${GITHUB_REF_NAME}</tag>" pom.xml
      - name: Publish to Maven Central
        run: mvn --batch-mode --no-transfer-progress -Pcentral deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
